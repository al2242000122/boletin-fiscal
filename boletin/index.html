<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de boletines fiscales — International Support Services, S.C.</title>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/plantilla-1.css">
<link rel="stylesheet" href="css/plantilla-2.css">
<link rel="stylesheet" href="css/plantilla-3.css">
<link rel="stylesheet" href="css/plantilla-4.css">
<link rel="stylesheet" href="css/print.css">

<!-- Única dependencia externa. Si no hay internet no carga, y la aplicación
     oculta el botón de PNG y sigue funcionando con Imprimir / PDF. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>

<header class="barra no-print">
  <div class="barra-marca">
    <b>Boletín fiscal</b>
    <span>International Support Services, S.C.</span>
  </div>

  <div class="barra-grupo">
    <span class="barra-etq">Plantilla</span>
    <div class="galeria" id="galeria" role="radiogroup" aria-label="Elegir plantilla"></div>
  </div>

  <div class="barra-grupo">
    <span class="barra-etq">Tema</span>
    <div class="temas" id="temas" role="radiogroup" aria-label="Elegir tema de color"></div>
  </div>

  <div class="barra-grupo">
    <button type="button" id="btn-editar" class="btn btn-primario" aria-pressed="false">Editar</button>
  </div>

  <div class="barra-grupo">
    <span class="barra-etq">Salida</span>
    <button type="button" id="btn-png" class="btn">Exportar PNG</button>
    <button type="button" id="btn-imprimir" class="btn">Imprimir / PDF</button>
  </div>

  <div class="barra-grupo">
    <span class="barra-etq">Archivo</span>
    <button type="button" id="btn-guardar" class="btn">Guardar</button>
    <button type="button" id="btn-cargar" class="btn">Cargar</button>
    <button type="button" id="btn-html" class="btn">Guardar HTML</button>
    <input type="file" id="entrada-json" accept="application/json,.json" hidden>
  </div>

  <div class="barra-espacio"></div>

  <p class="nota" id="nota-png" hidden>Sin conexión: la exportación a PNG no está
    disponible. Use Imprimir / PDF.</p>
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
</header>

<!-- Franja propia, fuera de la barra: es un aviso, no un control, y dentro de
     la barra apretaba los botones y quedaba descolocado. -->
<div class="restaurado no-print" id="restaurado" hidden>
  <span class="restaurado-tx" id="restaurado-tx">Se recuperó lo que estaba editando la última vez.</span>
  <button type="button" id="btn-conservar" class="btn btn-mini" hidden>
    Seguir con mi borrador
  </button>
  <button type="button" id="btn-descartar" class="btn btn-mini btn-peligro">
    Descartar y volver al texto original
  </button>
</div>

<main class="lienzo" id="lienzo">
  <div class="envoltorio" id="envoltorio">
    <div class="hoja" id="hoja" data-plantilla="1" data-tema="azul"></div>
  </div>
</main>

<script src="js/foto-default.js"></script>
<script src="js/estilos.js"></script>
<script src="js/contenido.js"></script>
<script src="js/plantillas.js"></script>
<script src="js/editor.js"></script>
<script src="js/exportar.js"></script>
<script src="js/app.js"></script>

</body>
</html>
