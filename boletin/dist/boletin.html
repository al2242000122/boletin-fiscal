var ESTILOS_EMBEBIDOS = "/* ==== tokens.css ==== */\n/* ==========================================================================\n   tokens.css — variables de diseño y temas\n   Los temas son SOLO sustitución de variables. Nunca cambian el layout.\n   Se aplican con [data-tema] sobre el contenedor .hoja.\n   ========================================================================== */\n\n:root{\n  /* Paleta base — tema \"azul\" */\n  --navy:      #0A2540;   /* fondos oscuros, títulos */\n  --navy-2:    #123A63;   /* bandas secundarias */\n  --acc:       #1D6FA5;   /* acento, viñetas, reglas */\n  --soft:      #E4EDF5;   /* cajas suaves */\n  --ink:       #17232F;   /* texto principal */\n  --mut:       #5D6E7E;   /* texto secundario */\n  --rule:      #DCE4EC;   /* hairlines */\n  --bad:       #B03A48;   /* riesgos */\n  --ok:        #1E8C74;   /* recomendaciones */\n\n  --sans: \"Inter\",\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --serif: Georgia,\"Times New Roman\",serif;\n\n  /* Derivadas — necesarias para que degradados y textos sobre oscuro\n     sigan al tema sin escribir reglas por plantilla. */\n  --navy-rgb:  10,37,64;      /* componentes de --navy, para rgba() */\n  --navy-hondo:#061A2E;       /* franja más honda que --navy (plantilla 4) */\n  --hoja-bg:   #ffffff;       /* fondo de la hoja */\n  --sobre-navy:      #FFFFFF; /* texto principal sobre fondo oscuro */\n  --sobre-navy-mut:  #A9C4DA; /* texto secundario sobre fondo oscuro */\n  --sobre-soft:      var(--ink); /* texto sobre la caja suave */\n}\n\n/* --- Tema azul (explícito, para que el selector pueda fijarlo) ----------- */\n[data-tema=\"azul\"]{\n  --navy:#0A2540;  --navy-2:#123A63;  --acc:#1D6FA5;  --soft:#E4EDF5;\n  --ink:#17232F;   --mut:#5D6E7E;     --rule:#DCE4EC; --bad:#B03A48; --ok:#1E8C74;\n  --navy-rgb:10,37,64;\n  --navy-hondo:#061A2E;\n  --hoja-bg:#ffffff;\n  --sobre-navy:#FFFFFF; --sobre-navy-mut:#A9C4DA; --sobre-soft:var(--ink);\n}\n\n/* --- Tema verde --------------------------------------------------------- */\n[data-tema=\"verde\"]{\n  --navy:#12352C;  --navy-2:#1B4A3D;  --acc:#C6742A;  --soft:#EFE9DC;\n  --ink:#17232F;   --mut:#5D6E7E;     --rule:#DCE4EC; --bad:#B03A48; --ok:#1E8C74;\n  --navy-rgb:18,53,44;\n  --navy-hondo:#0B241D;\n  --hoja-bg:#ffffff;\n  --sobre-navy:#FFFFFF; --sobre-navy-mut:#BFD3C6; --sobre-soft:var(--ink);\n}\n\n/* --- Tema nocturno -----------------------------------------------------------\n   Bloque completo, no parches: además de la paleta hay que invertir tinta,\n   texto secundario, hairlines y el fondo de la hoja. --bad y --ok se aclaran\n   porque los originales no contrastan sobre #0E1116.\n   -------------------------------------------------------------------------- */\n[data-tema=\"nocturno\"]{\n  --navy:#0E1116;  --navy-2:#161B22;  --acc:#C9A227;  --soft:#1A1F26;\n  --ink:#E7E9EC;   --mut:#8A9199;     --rule:#1E242C; --bad:#E2707C; --ok:#4FC0A5;\n  --navy-rgb:14,17,22;\n  --navy-hondo:#05070A;\n  --hoja-bg:var(--navy);\n  --sobre-navy:#F1F3F5; --sobre-navy-mut:#98A2AD; --sobre-soft:var(--ink);\n}\n\n\n/* ==== app.css ==== */\n/* ==========================================================================\n   app.css — interfaz de la aplicación (barra, lienzo, estados de edición).\n   Nada de aquí forma parte del boletín; todo lo marcado .no-print se oculta\n   al imprimir y se retira antes de exportar el PNG.\n   ========================================================================== */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml, body { height: 100%; }\n\nbody{\n  margin: 0;\n  font-family: var(--sans);\n  color: #E9EDF2;\n  background: #202832;\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ---- Barra de herramientas --------------------------------------------- */\n/* La barra se reparte en varias filas cuando no cabe. Antes se apretaba: la\n   marca partía en cuatro renglones y \"Guardar HTML\" se rompía en dos. */\n.barra{\n  position: sticky;\n  top: 0;\n  z-index: 20;\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 10px 18px;\n  padding: 10px 20px;\n  background: #161C24;\n  border-bottom: 1px solid #2C3540;\n}\n\n.barra-marca{\n  display: flex;\n  flex-direction: column;\n  flex: 0 0 auto;\n  line-height: 1.25;\n  margin-right: 6px;\n  white-space: nowrap;\n}\n.barra-marca b{ font-size: 13px; font-weight: 600; letter-spacing: .01em; }\n.barra-marca span{ font-size: 11px; color: #93A1B1; }\n\n.barra-grupo{\n  display: flex;\n  align-items: center;\n  flex: 0 0 auto;\n  gap: 8px;\n}\n.barra-grupo + .barra-grupo{\n  padding-left: 18px;\n  border-left: 1px solid #2C3540;\n}\n/* Al envolverse, el separador de la izquierda sobra en el primer grupo de cada\n   fila; no se puede detectar en CSS, así que se deja: es una línea fina y\n   funciona como separación visual igual. */\n.barra-espacio{ flex: 1 1 auto; }\n\n.barra-etq{\n  font-size: 10.5px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: #7E8C9C;\n  margin-right: 2px;\n}\n\n/* ---- Botones ------------------------------------------------------------ */\n.btn{\n  font: inherit;\n  font-size: 12.5px;\n  line-height: 1;\n  padding: 9px 14px;\n  border-radius: 6px;\n  border: 1px solid #38434F;\n  background: #232C36;\n  color: #E9EDF2;\n  cursor: pointer;\n  white-space: nowrap;     /* \"Guardar HTML\" no debe partirse en dos renglones */\n  transition: background .12s ease, border-color .12s ease;\n}\n.btn:hover{ background: #2B3641; border-color: #485665; }\n.btn:active{ background: #1E262F; }\n.btn:focus-visible{ outline: 2px solid #4FA3DA; outline-offset: 2px; }\n.btn[disabled]{ opacity: .45; cursor: not-allowed; }\n\n.btn-primario{\n  background: #1D6FA5;\n  border-color: #1D6FA5;\n  color: #fff;\n  font-weight: 600;\n}\n.btn-primario:hover{ background: #2280BC; border-color: #2280BC; }\n.btn-primario.activo{ background: #1E8C74; border-color: #1E8C74; }\n.btn-primario.activo:hover{ background: #23A085; border-color: #23A085; }\n\n.btn-mini{\n  font-size: 11px;\n  padding: 4px 9px;\n  border-radius: 4px;\n}\n\n.nota{\n  font-size: 11.5px;\n  color: #9AA8B7;\n  max-width: 260px;\n  line-height: 1.35;\n}\n\n.restaurado{\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  font-size: 12px;\n  color: #E4D9B8;\n  background: #33301F;\n  border-bottom: 1px solid #4A452C;\n  padding: 8px 20px;\n}\n.restaurado[hidden]{ display: none; }\n.restaurado-tx{ flex: 1 1 auto; }\n\n/* El texto base cambió y el usuario sigue viendo su borrador: se marca más\n   fuerte porque es una discrepancia, no un simple \"se recuperó tu trabajo\". */\n.restaurado-caduco{\n  color: #FFD9A8;\n  background: #3A2A16;\n  border-bottom-color: #6B4E24;\n}\n\n.btn-peligro{\n  border-color: #7A4A50;\n  background: #3A2028;\n  color: #FFC9CF;\n}\n.btn-peligro:hover{ background: #4A282F; border-color: #9A5C63; }\n\n/* ---- Galería de plantillas ---------------------------------------------- */\n.galeria, .temas{ display: flex; align-items: flex-end; gap: 6px; }\n\n.plantilla-op{\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 5px;\n  padding: 6px 7px 5px;\n  border: 1px solid #38434F;\n  border-radius: 6px;\n  background: #232C36;\n  color: #93A1B1;\n  font: inherit;\n  font-size: 9.5px;\n  cursor: pointer;\n  transition: border-color .12s ease, background .12s ease, color .12s ease;\n}\n.plantilla-op:hover{ background: #2B3641; border-color: #56677A; color: #D5DEE8; }\n.plantilla-op.activa{ border-color: #4FA3DA; background: #1B2C3B; color: #EAF2F9; }\n.plantilla-op:focus-visible{ outline: 2px solid #4FA3DA; outline-offset: 2px; }\n.plantilla-nom{ white-space: nowrap; letter-spacing: .01em; }\n\n/* Miniaturas dibujadas con divs: sin imágenes, funcionan sin internet. */\n.mini{\n  position: relative;\n  display: block;\n  background: #fff;\n  border: 1px solid #4A5866;\n  overflow: hidden;\n}\n.mini i{ position: absolute; display: block; }\n.mini .m-navy { background: #0A2540; }\n.mini .m-navy2{ background: #123A63; }\n.mini .m-acc  { background: #1D6FA5; }\n.mini .m-soft { background: #D9E5F0; }\n.mini .m-ln   { background: #B9C6D3; }\n\n/* ---- Temas --------------------------------------------------------------- */\n.tema-op{\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  padding: 7px 10px 7px 8px;\n  border: 1px solid #38434F;\n  border-radius: 6px;\n  background: #232C36;\n  color: #93A1B1;\n  font: inherit;\n  font-size: 11.5px;\n  cursor: pointer;\n  transition: border-color .12s ease, background .12s ease, color .12s ease;\n}\n.tema-op:hover{ background: #2B3641; border-color: #56677A; color: #D5DEE8; }\n.tema-op.activa{ border-color: #4FA3DA; background: #1B2C3B; color: #EAF2F9; }\n.tema-op:focus-visible{ outline: 2px solid #4FA3DA; outline-offset: 2px; }\n\n.muestra{\n  width: 22px;\n  height: 12px;\n  border-radius: 3px;\n  border: 1px solid rgba(255,255,255,.25);\n  background: linear-gradient(90deg, var(--navy) 0 55%, var(--acc) 55% 100%);\n}\n\n/* ---- Avisos -------------------------------------------------------------- */\n.aviso{\n  font-size: 12px;\n  padding: 7px 12px;\n  border-radius: 6px;\n  background: transparent;\n  color: #9AA8B7;\n  opacity: 0;\n  transition: opacity .15s ease;\n  max-width: 420px;\n}\n.aviso.visible{ opacity: 1; background: #232C36; }\n.aviso-ok.visible{ color: #7ED8BF; }\n.aviso-error.visible{ color: #FFB3BC; background: #3A2028; }\n\n/* ---- Lienzo y hoja ------------------------------------------------------- */\n.lienzo{\n  padding: 24px;\n  display: flex;\n  justify-content: center;\n  align-items: flex-start;\n  min-height: calc(100vh - 60px);\n  overflow: auto;\n}\n\n.envoltorio{ position: relative; }\n\n.hoja{\n  position: relative;\n  overflow: hidden;\n  background: var(--hoja-bg);\n  color: var(--ink);\n  font-family: var(--sans);\n  box-shadow: 0 10px 40px rgba(0,0,0,.45);\n  transform-origin: top left;\n}\n\n/* ==========================================================================\n   Estados de edición — solo dentro de .editando\n   ========================================================================== */\n\n.editando [contenteditable]:hover { outline: 1px dashed rgba(29,111,165,.55); outline-offset: 3px; }\n.editando [contenteditable]:focus { outline: 2px solid var(--acc); outline-offset: 3px;\n                                    background: rgba(29,111,165,.06); }\n\n/* Un campo vaciado del todo sigue siendo clicable. */\n.editando [contenteditable]:empty{ min-width: 26px; min-height: 1em; display: inline-block; }\n\n.editando [data-foto]{ cursor: pointer; }\n.editando [data-foto]::after{\n  content: \"Cambiar fotografía\";\n  position: absolute;\n  right: 10px;\n  bottom: 8px;\n  z-index: 3;\n  font-size: 10px;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  padding: 5px 9px;\n  border-radius: 4px;\n  background: rgba(0,0,0,.55);\n  color: #fff;\n  opacity: 0;\n  transition: opacity .12s ease;\n  pointer-events: none;\n}\n.editando [data-foto]:hover::after{ opacity: 1; }\n\n/* ---- Controles de viñetas ------------------------------------------------ */\n.solo-edicion{ display: none; }\n.editando .solo-edicion{ display: inline-flex; }\n\n.quitar-vineta{\n  position: absolute;\n  left: -4px;\n  top: 1px;\n  z-index: 4;\n  width: 15px;\n  height: 15px;\n  padding: 0;\n  align-items: center;\n  justify-content: center;\n  font: 700 13px/1 var(--sans);\n  border: 0;\n  border-radius: 50%;\n  background: var(--bad);\n  color: #fff;\n  cursor: pointer;\n  opacity: 0;\n  transition: opacity .1s ease;\n}\n.editando .it:hover .quitar-vineta{ opacity: 1; }\n.editando .it:hover::before{ opacity: 0; }\n.quitar-vineta:focus-visible{ opacity: 1; outline: 2px solid #fff; outline-offset: 1px; }\n.quitar-vineta[disabled]{ background: #98A2AC; cursor: not-allowed; }\n\n.agregar-vineta{\n  position: absolute;\n  right: 0;\n  bottom: -17px;\n  z-index: 4;\n  align-items: center;\n  padding: 2px 8px;\n  font: 600 10px/1.5 var(--sans);\n  letter-spacing: .04em;\n  border: 1px solid var(--acc);\n  border-radius: 999px;\n  background: #fff;\n  color: var(--acc);\n  cursor: pointer;\n  white-space: nowrap;\n}\n.agregar-vineta:hover{ background: var(--acc); color: #fff; }\n.agregar-vineta:focus-visible{ outline: 2px solid var(--acc); outline-offset: 2px; }\n.agregar-vineta.dentro{ right: 8px; bottom: 6px; }\n\n\n/* ==== plantilla-1.css ==== */\n/* ==========================================================================\n   plantilla-1.css — Ejecutivo vertical · 816 × 1056 (carta exacta a 96 dpi)\n\n   Trampas de la §10 aplicadas:\n   · (1) La foto es background-size:cover sobre un contenedor de altura fija.\n         No hay <img height:100%> que pueda reventar la hoja.\n   · (2) Los hijos directos de filas flex llevan min-height:0 (y overflow:hidden\n         donde no hay controles de edición encima).\n   · (4) El rombo de riesgos se posiciona con top en px, no con translateY, así\n         que rotate(45deg) queda solo en su declaración y no se pisa nada.\n   · (7) Las entradas en cursiva van alineadas a la izquierda, nunca justificadas.\n   ========================================================================== */\n\n.p1{\n  width: 100%;\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  background: var(--hoja-bg);\n  color: var(--ink);\n  font-family: var(--sans);\n}\n\n.p1 .blk{ position: relative; }\n\n.p1 .lista{ margin: 0; padding: 0; list-style: none; }\n.p1 .it{ position: relative; padding-left: 17px; }\n.p1 .it .tx{ display: block; }\n\n/* ---- 1. Banda superior --------------------------------------------------- */\n.p1-banda{\n  flex: 0 0 38px;\n  min-height: 0;\n  background: var(--navy);\n  color: var(--sobre-navy);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 20px;\n  padding: 0 40px;\n}\n.p1-kicker{\n  font-size: 10.5px;\n  font-weight: 700;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--sobre-navy-mut);\n  white-space: nowrap;\n}\n.p1-firma{\n  font-size: 11px;\n  color: var(--sobre-navy);\n  opacity: .92;\n  white-space: nowrap;\n}\n\n/* ---- 2. Hero ------------------------------------------------------------- */\n.p1-hero{\n  flex: 0 0 139px;\n  min-height: 0;\n  display: flex;\n}\n\n.p1-art{\n  flex: 0 0 212px;\n  min-width: 0;\n  min-height: 0;\n  overflow: hidden;\n  background: var(--navy-2);\n  color: var(--sobre-navy);\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  padding: 0 8px 0 40px;\n}\n.p1-art-etq{\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: .22em;\n  text-transform: uppercase;\n  color: var(--sobre-navy-mut);\n}\n.p1-art-num{\n  display: block;\n  font-size: 60px;\n  font-weight: 700;\n  line-height: 1.05;\n  letter-spacing: -.02em;\n  margin: 3px 0 5px;\n  white-space: nowrap;   /* el numeral nunca parte en dos líneas */\n}\n.p1-art-ord{\n  display: block;\n  font-size: 10.5px;\n  line-height: 1.28;\n  color: var(--sobre-navy);\n  opacity: .88;\n}\n\n.p1-foto{\n  position: relative;\n  flex: 1;\n  min-width: 0;\n  min-height: 0;\n  overflow: hidden;\n  display: flex;\n  align-items: center;\n  padding: 0 40px;\n  background-color: var(--navy);\n  background-size: cover;\n  /* La torre es la aguja central de una foto muy vertical. Con cover, en una\n     banda de 604x139 el encuadre por defecto caía en el cielo y la torre\n     desaparecía; al 46 % entra la aguja. */\n  background-position: center 46%;\n  background-repeat: no-repeat;\n}\n.p1-velo{\n  position: absolute;\n  inset: 0;\n  z-index: 1;\n  /* Velo aclarado para que la torre se vea. Medido sobre la foto real: el\n     texto blanco queda a 5.14:1 en su punto peor, por encima del 4.5:1 que\n     pide la AA. Con .82/.38 la torre luce más pero el contraste cae a 3.44:1. */\n  background: linear-gradient(90deg, rgba(var(--navy-rgb),.88), rgba(var(--navy-rgb),.55));\n}\n.p1-gancho{\n  position: relative;\n  z-index: 2;\n  margin: 0;\n  font-size: 16px;\n  font-weight: 600;\n  line-height: 1.38;\n  color: var(--sobre-navy);\n}\n\n/* ---- 3. Cuerpo ----------------------------------------------------------- */\n.p1-cuerpo{\n  --p1-fs: 1;                /* factor de autoajuste; lo fija Plantillas.ajustarEjecutivo */\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  gap: calc(34px * var(--p1-fs, 1));\n  padding: 22px 40px 0;\n}\n\n.p1-h3{\n  margin: 0 0 4px;\n  font-size: calc(14px * var(--p1-fs, 1));\n  font-weight: 700;\n  letter-spacing: .07em;\n  text-transform: uppercase;\n  color: var(--acc);\n  line-height: 1.15;\n}\n.tono-riesgo .p1-h3{ color: var(--bad); }\n.tono-recomendacion .p1-h3{ color: var(--ok); }\n\n.p1-entrada{\n  margin: 0 0 2px;\n  font-size: calc(12px * var(--p1-fs, 1));\n  font-style: italic;\n  line-height: 1.5;\n  color: var(--mut);\n  text-align: left;          /* §10.7 — nunca justificar cursiva */\n}\n\n.p1-p{\n  margin: 0;\n  font-size: calc(13.2px * var(--p1-fs, 1));\n  line-height: 1.52;\n  color: var(--ink);\n}\n\n.p1-lista .it{\n  font-size: calc(12.8px * var(--p1-fs, 1));\n  line-height: 1.46;\n  color: var(--ink);\n}\n\n/* Viñetas ---------------------------------------------------------------------\n   Dos cosas que hay que respetar aquí (§10.3 y §10.5):\n\n   · La regla base debe alcanzar TODAS las listas de la plantilla (.p1-lista y\n     .p1-apoyo-lista). Si el ::before no queda absoluto, la viñeta entra en el\n     flujo y empuja el texto una línea hacia abajo.\n   · La base NO declara `content`. Si declarara content:\"\" con más\n     especificidad que las variantes, borraría la palomita y el chevron y las\n     listas se quedarían sin viñeta. Cada variante declara su propio content y\n     todas llevan el prefijo .p1 para pesar lo mismo.\n   ------------------------------------------------------------------------- */\n.p1 .lista .it::before{\n  position: absolute;\n  left: 0;\n  transition: opacity .1s ease;\n}\n.p1 .p1-puede .it::before{\n  content: \"\";\n  top: 7px;\n  width: 5px;\n  height: 5px;\n  border-radius: 50%;\n  background: var(--acc);\n}\n/* §10.4 — el rombo se sitúa con top en px, así rotate(45deg) queda solo en su\n   propia declaración y no hay que componerlo con ningún translate. */\n.p1 .tono-riesgo .it::before{\n  content: \"\";\n  top: 6px;\n  width: 6px;\n  height: 6px;\n  background: var(--bad);\n  transform: rotate(45deg);\n}\n.p1 .tono-recomendacion .it::before{\n  content: \"✓\";\n  top: 0;\n  font-size: 12px;\n  font-weight: 700;\n  line-height: 1.58;\n  color: var(--ok);\n}\n\n/* 3.b — ¿Qué puede hacer el SAT?: dos columnas con flujo POR COLUMNA.\n\n   Va con columnas de texto, NO con rejilla. Con grid, las dos columnas\n   comparten la altura de cada fila: una viñeta de una línea junto a otra de\n   dos se quedaba con una línea entera en blanco debajo, impuesta por su\n   vecina. Medido antes del cambio: 17.9 px muertos bajo cada viñeta corta.\n\n   Con column-count cada viñeta ocupa solo lo que mide, y el orden de lectura\n   sigue siendo por columna (1-2-3 abajo, luego 4-5-6), que es lo que pide la\n   §7.1. break-inside evita que una viñeta se parta entre columnas. */\n.p1-puede .p1-lista{\n  column-count: 2;\n  column-gap: 34px;\n}\n.p1-puede .it{\n  break-inside: avoid;\n  margin-bottom: calc(7px * var(--p1-fs, 1));\n}\n.p1-puede .it:last-child{ margin-bottom: 0; }\n\n/* 3.c — Riesgos y preparación, lado a lado */\n.p1-fila2{\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 34px;\n}\n.p1-fila2 .it + .it{ margin-top: 4px; }\n\n/* 3.d — Nuestro consejo */\n.p1-consejo{\n  margin-top: auto;\n  background: var(--navy-2);\n  color: var(--sobre-navy);\n  display: flex;\n  align-items: flex-start;\n  gap: 20px;\n  padding: 15px 26px;\n}\n.p1-consejo-etq{\n  flex: 0 0 86px;\n  margin: 0;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: .14em;\n  line-height: 1.5;\n  text-transform: uppercase;\n  color: var(--sobre-navy-mut);\n}\n.p1-consejo-tx{\n  margin: 0;\n  flex: 1;\n  min-width: 0;\n  font-size: calc(13.2px * var(--p1-fs, 1));\n  line-height: 1.44;\n  color: var(--sobre-navy);\n}\n\n/* 3.e — ¿Necesita apoyo? (banda a sangre) */\n.p1-apoyo{\n  margin: 0 -40px;\n  background: var(--soft);\n  color: var(--sobre-soft);\n  display: flex;\n  align-items: flex-start;\n  gap: 20px;\n  padding: 14px 40px;\n}\n.p1-apoyo-izq{ flex: 0 0 92px; min-width: 0; }\n.p1-apoyo-der{ flex: 1; min-width: 0; }\n.p1-apoyo-etq{\n  margin: 0;\n  font-size: 10.5px;\n  font-weight: 700;\n  letter-spacing: .12em;\n  line-height: 1.5;\n  text-transform: uppercase;\n  color: var(--acc);\n}\n.p1-apoyo-entrada{\n  margin: 4px 0 0;\n  font-size: calc(11px * var(--p1-fs, 1));\n  font-style: italic;\n  line-height: 1.4;\n  color: var(--mut);\n  text-align: left;          /* §10.7 */\n}\n.p1-apoyo-lista{\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  column-gap: 28px;\n  row-gap: 4px;\n}\n.p1-apoyo .it{ padding-left: 13px; font-size: calc(12px * var(--p1-fs, 1)); line-height: 1.45; }\n.p1 .p1-apoyo .it::before{\n  content: \"›\";\n  top: 0;\n  font-size: 13px;\n  font-weight: 700;\n  line-height: 1.38;\n  color: var(--acc);\n}\n\n/* ---- 4. Pie -------------------------------------------------------------- */\n.p1-pie{\n  flex: 0 0 48px;\n  min-height: 0;\n  background: var(--navy);\n  color: var(--sobre-navy);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 20px;\n  padding: 0 40px;\n}\n.p1-pie-izq{ min-width: 0; }\n.p1-pie-entrada{\n  margin: 0;\n  font-size: 10.5px;\n  line-height: 1.45;\n  color: var(--sobre-navy-mut);\n}\n.p1-pie-firma{\n  margin: 0;\n  font-size: 11.5px;\n  font-weight: 700;\n  line-height: 1.45;\n  color: var(--sobre-navy);\n}\n.p1-pie-correos{\n  margin: 0;\n  font-size: 11.5px;\n  line-height: 1.45;\n  color: var(--sobre-navy-mut);\n  white-space: nowrap;\n}\n\n\n/* ==== plantilla-2.css ==== */\n/* ==========================================================================\n   plantilla-2.css — Procedimiento horizontal · 1400 × 1000\n\n   Trampas de la §10 aplicadas:\n   · (2) Los hijos de las filas flex llevan min-height:0.\n   · (3) Las listas de riesgos y preparación reparten la altura con ul{flex:1}\n         + li{flex:1} y hairlines entre ítems: queda como tabla, sin hueco\n         muerto al final.\n   · (4) Las viñetas absolutas de esas listas van a top:50% con translateY(-50%)\n         en la MISMA declaración que cualquier otra transformación.\n   · (5) Las variantes de ::before llevan el prefijo .p2 para pesar lo mismo\n         que la regla base, que no declara content.\n   · (7) Las entradas en cursiva nunca se justifican.\n   ========================================================================== */\n\n.p2{\n  width: 100%;\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  background: var(--hoja-bg);\n  color: var(--ink);\n  font-family: var(--sans);\n}\n\n.p2 .blk{ position: relative; }\n.p2 .lista{ margin: 0; padding: 0; list-style: none; }\n\n.p2-h3{\n  margin: 0;\n  font-size: 12.5px;\n  font-weight: 700;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--acc);\n  line-height: 1.3;\n}\n.tono-riesgo .p2-h3{ color: var(--bad); }\n.tono-recomendacion .p2-h3{ color: var(--ok); }\n\n.p2-entrada{\n  margin: 3px 0 0;\n  font-size: 12.5px;\n  font-style: italic;\n  line-height: 1.4;\n  color: var(--mut);\n  text-align: left;          /* §10.7 */\n}\n\n/* ---- 1. Encabezado -------------------------------------------------------- */\n.p2-cabeza{\n  flex: 0 0 190px;\n  min-height: 0;\n  padding: 34px 52px 0;\n  display: flex;\n  flex-direction: column;\n}\n.p2-cabeza-fila{\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: 40px;\n  flex: 1;\n  min-height: 0;\n}\n.p2-titulo{ min-width: 0; }\n.p2-kicker{\n  display: block;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--acc);\n}\n.p2-art{\n  margin: 8px 0 0;\n  font-size: 42px;\n  font-weight: 700;\n  line-height: 1.06;\n  letter-spacing: -.015em;\n  color: var(--navy);\n}\n.p2-ord{\n  display: block;\n  margin-top: 3px;\n  font-size: 22px;\n  line-height: 1.25;\n  color: var(--mut);\n}\n.p2-plazo{\n  flex: 0 0 auto;\n  text-align: right;\n  min-width: 0;\n}\n.p2-plazo-num{\n  display: block;\n  font-size: 58px;\n  font-weight: 700;\n  line-height: 1;\n  letter-spacing: -.02em;\n  color: var(--navy);\n}\n.p2-plazo-uni{\n  display: block;\n  margin-top: 4px;\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--mut);\n}\n\n/* Riel de plazo: representa el plazo de 24 días hábiles, nada más. */\n.p2-riel{\n  flex: 0 0 auto;\n  display: flex;\n  align-items: center;\n  gap: 18px;\n  padding-bottom: 11px;\n  border-bottom: 3px solid var(--navy);\n}\n.p2-riel-etq{\n  font-size: 10.5px;\n  font-weight: 600;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: var(--mut);\n  white-space: nowrap;\n}\n.p2-riel-barra{\n  flex: 1;\n  height: 6px;\n  border-radius: 3px;\n  background: linear-gradient(90deg, var(--acc), var(--navy));\n}\n\n/* ---- 2. Banda del gancho -------------------------------------------------- */\n.p2-gancho{\n  flex: 0 0 88px;\n  min-height: 0;\n  display: flex;\n  align-items: center;\n  padding: 0 52px;\n  background: var(--navy);\n  color: var(--sobre-navy);\n}\n.p2-gancho-tx{\n  margin: 0;\n  font-size: 17px;\n  font-weight: 600;\n  line-height: 1.41;\n}\n\n/* ---- 3. Cinco tarjetas ---------------------------------------------------- */\n.p2-puede{\n  flex: 0 0 181px;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  border-bottom: 1px solid var(--rule);\n}\n.p2-rotulo{\n  flex: 0 0 auto;\n  display: flex;\n  align-items: baseline;\n  gap: 22px;\n  padding: 14px 52px 10px;\n}\n.p2-rotulo .p2-entrada{ margin: 0; }\n\n.p2-tarjetas{\n  flex: 1;\n  min-height: 0;\n  display: grid;\n  grid-auto-flow: column;\n  grid-auto-columns: 1fr;\n}\n.p2-tarjeta{\n  position: relative;\n  min-width: 0;\n  padding: 0 24px;\n  border-right: 1px solid var(--rule);\n}\n.p2-tarjeta:last-child{ border-right: 0; }\n.p2-num{\n  display: block;\n  font-family: var(--serif);\n  font-size: 26px;\n  line-height: 1.1;\n  color: var(--acc);\n}\n.p2-tarjeta .tx{\n  display: block;\n  margin-top: 10px;\n  font-size: 12.5px;\n  line-height: 1.44;\n  color: var(--ink);\n}\n.p2-tarjeta .quitar-vineta{ left: auto; right: 8px; top: 2px; }\n\n/* ---- 4. Cuerpo en tres columnas ------------------------------------------- */\n.p2-cuerpo{\n  flex: 1;\n  min-height: 0;\n  display: grid;\n  grid-template-columns: 1fr 1fr 444px;\n  gap: 36px;\n  padding: 22px 52px 0;\n}\n.p2-col{\n  min-width: 0;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n}\n\n/* §10.3 — las listas reparten la altura sobrante entre sus ítems y se separan\n   con hairlines. Sin esto queda un hueco muerto al final de la columna. */\n.p2-col .p2-lista{\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  margin-top: 10px;\n}\n.p2-col .it{\n  flex: 1;\n  min-height: 0;\n  position: relative;\n  display: flex;\n  align-items: center;\n  padding: 4px 0 4px 22px;\n  border-bottom: 1px solid var(--rule);\n  font-size: 13px;\n  line-height: 1.42;\n  color: var(--ink);\n}\n.p2-col .it:last-child{ border-bottom: 0; }\n\n/* §10.4 — la viñeta se centra sobre el ítem, no se cuelga de la primera línea.\n   Si hiciera falta rotar, rotate y translateY irían en esta MISMA declaración. */\n.p2 .p2-col .it::before{\n  position: absolute;\n  left: 0;\n  top: 50%;\n  transform: translateY(-50%);\n}\n.p2 .tono-riesgo .it::before{\n  content: \"\";\n  width: 8px;\n  height: 8px;\n  background: var(--bad);\n}\n.p2 .tono-recomendacion .it::before{\n  content: \"✓\";\n  font-size: 13px;\n  font-weight: 700;\n  line-height: 1;\n  color: var(--ok);\n}\n\n.p2-aside{\n  min-width: 0;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  padding: 24px;\n  background: var(--soft);\n  color: var(--sobre-soft);\n}\n.p2-aside-blq{ min-height: 0; }\n.p2-aside-consejo{ margin-top: auto; }\n.p2-p{\n  margin: 12px 0 0;\n  font-size: 13px;\n  line-height: 1.54;\n  color: var(--ink);\n}\n.p2-consejo-tx{\n  margin: 12px 0 0;\n  font-size: 13px;\n  font-weight: 600;\n  line-height: 1.5;\n  color: var(--navy);\n}\n\n/* ---- 5. Pie --------------------------------------------------------------- */\n.p2-pie{\n  flex: 0 0 99px;\n  min-height: 0;\n  display: flex;\n  align-items: center;\n  gap: 28px;\n  padding: 0 52px;\n  background: var(--navy-2);\n  color: var(--sobre-navy);\n}\n.p2-pie-etq{ flex: 0 0 200px; min-width: 0; }\n.p2-pie .p2-h3{ color: var(--sobre-navy-mut); }\n.p2-pie .p2-entrada{ color: var(--sobre-navy-mut); opacity: .9; font-size: 11px; }\n\n.p2-apoyo-lista{\n  flex: 1;\n  min-width: 0;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  column-gap: 28px;\n  row-gap: 6px;\n}\n.p2-apoyo-lista .it{\n  position: relative;\n  padding-left: 15px;\n  font-size: 11.5px;\n  line-height: 1.45;\n}\n.p2 .p2-apoyo-lista .it::before{\n  content: \"›\";\n  position: absolute;\n  left: 0;\n  top: 0;\n  font-size: 13px;\n  font-weight: 700;\n  line-height: 1.3;\n  color: var(--sobre-navy-mut);\n}\n\n.p2-contacto{\n  flex: 0 0 300px;\n  min-width: 0;\n  padding-left: 32px;\n  border-left: 1px solid rgba(255,255,255,.22);\n  text-align: right;\n}\n.p2-pie-entrada{\n  margin: 0;\n  font-size: 10.5px;\n  line-height: 1.4;\n  color: var(--sobre-navy-mut);\n}\n.p2-pie-firma{\n  margin: 4px 0 0;\n  font-size: 12.5px;\n  font-weight: 700;\n  line-height: 1.35;\n}\n.p2-pie-correos{\n  margin: 2px 0 0;\n  font-size: 11.5px;\n  line-height: 1.35;\n  color: var(--sobre-navy-mut);\n}\n\n.p2-pie .agregar-vineta.dentro{ right: 340px; bottom: 4px; }\n\n\n/* ==== plantilla-3.css ==== */\n/* ==========================================================================\n   plantilla-3.css — Editorial · 816 × 1056 (carta exacta a 96 dpi)\n\n   El contraste sans/serif es lo que sostiene la dirección: rótulos en sans\n   versalitas, cuerpo en serif. Sin fotografía.\n\n   Trampas de la §10 aplicadas:\n   · (2) min-height:0 en los hijos de la columna flex.\n   · (5) Las variantes de ::before llevan prefijo .p3 para pesar lo mismo que\n         la regla base, que no declara content.\n   · (7) El gancho y el consejo van en cursiva: alineados a la izquierda, NUNCA\n         justificados. En cursiva el justificado abre ríos horribles.\n   ========================================================================== */\n\n.p3{\n  width: 100%;\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  padding: 46px 52px 0;\n  background: var(--hoja-bg);\n  color: var(--ink);\n  font-family: var(--sans);\n}\n\n.p3 .blk{ position: relative; }\n.p3 .lista{ margin: 0; padding: 0; list-style: none; }\n\n/* ---- 1. Cabecera --------------------------------------------------------- */\n.p3-cabeza{\n  flex: 0 0 auto;\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 20px;\n  padding-bottom: 9px;\n  border-bottom: 3px double var(--navy);\n}\n.p3-masthead{\n  font-family: var(--serif);\n  font-size: 26px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  line-height: 1.15;\n  color: var(--navy);\n  white-space: nowrap;\n}\n.p3-cabeza-der{\n  font-size: 10px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: var(--mut);\n  text-align: right;\n}\n\n/* ---- 2. Titular ---------------------------------------------------------- */\n.p3-titular{\n  flex: 0 0 auto;\n  padding: 20px 0 13px;\n  border-bottom: 1px solid var(--rule);\n}\n.p3-kicker{\n  display: block;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--acc);\n}\n.p3-art{\n  margin: 12px 0 0;\n  font-family: var(--serif);\n  font-size: 34px;\n  font-weight: 400;\n  line-height: 1.12;\n  color: var(--navy);\n}\n.p3-sub{\n  display: block;\n  margin-top: 10px;\n  font-family: var(--serif);\n  font-size: 15px;\n  font-style: italic;\n  line-height: 1.35;\n  color: var(--mut);\n}\n\n/* ---- 3. Destacado -------------------------------------------------------- */\n.p3-destacado{\n  flex: 0 0 auto;\n  margin: 16px 0 0;\n  padding: 12px 24px;\n  background: var(--soft);\n  color: var(--sobre-soft);\n  border-left: 4px solid var(--acc);\n}\n.p3-gancho{\n  margin: 0;\n  font-family: var(--serif);\n  font-size: 14.5px;\n  font-style: italic;\n  line-height: 1.46;\n  text-align: left;          /* §10.7 */\n}\n\n/* ---- 4. Cuerpo a dos columnas -------------------------------------------- */\n.p3-cuerpo{\n  flex: 1;\n  min-height: 0;\n  --p3-fs: 1;                /* factor de autoajuste; lo fija Plantillas.ajustarEditorial */\n  padding: 22px 0 14px;\n  column-count: 2;\n  column-gap: 34px;\n  column-rule: 1px solid var(--rule);\n  column-fill: auto;         /* llena la primera columna y pasa a la segunda */\n}\n.p3-blk{\n  break-inside: avoid;\n  margin: 0 0 calc(9px * var(--p3-fs, 1));\n}\n.p3-blk:last-child{ margin-bottom: 0; }\n\n.p3-h3{\n  margin: 0 0 4px;\n  padding-bottom: 3px;\n  border-bottom: 1px solid var(--rule);\n  font-family: var(--sans);\n  font-size: calc(11.5px * var(--p3-fs, 1));\n  font-weight: 700;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--acc);\n  line-height: 1.3;\n}\n.tono-riesgo .p3-h3{ color: var(--bad); }\n.tono-recomendacion .p3-h3{ color: var(--ok); }\n\n.p3-entrada{\n  margin: 0 0 3px;\n  font-size: calc(11px * var(--p3-fs, 1));\n  font-style: italic;\n  line-height: 1.45;\n  color: var(--mut);\n  text-align: left;          /* §10.7 */\n}\n\n.p3-p{\n  margin: 0;\n  font-family: var(--serif);\n  font-size: calc(12.7px * var(--p3-fs, 1));\n  line-height: 1.52;\n  text-align: justify;\n  hyphens: auto;\n  color: var(--ink);\n}\n\n.p3-lista .it{\n  position: relative;\n  padding-left: 18px;\n  margin-bottom: 3px;\n  font-family: var(--serif);\n  font-size: calc(12.4px * var(--p3-fs, 1));\n  line-height: 1.36;\n  color: var(--ink);\n}\n.p3-lista .it:last-child{ margin-bottom: 0; }\n\n/* §10.5 — el color de la viñeta viaja por variable heredada, no por un\n   selector más específico. Así .tono-riesgo no tiene que ganarle en peso a la\n   regla base del ::before, que es lo que hace que se pierdan estos overrides. */\n.p3 .p3-lista .it::before{\n  content: \"•\";\n  position: absolute;\n  left: 4px;\n  top: 0;\n  font-family: var(--sans);\n  font-size: calc(13px * var(--p3-fs, 1));\n  line-height: 1.35;\n  color: var(--vineta, var(--acc));\n}\n.p3-blk.tono-riesgo{ --vineta: var(--bad); }\n.p3-blk.tono-recomendacion{ --vineta: var(--ok); }\n\n/* El procedimiento del SAT va numerado: son actuaciones sucesivas, no un\n   listado suelto. La numeración la lleva el contador de CSS, no el dato. */\n.p3-numerada .p3-lista{ counter-reset: paso; }\n.p3-numerada .it{ padding-left: 22px; }\n.p3 .p3-numerada .p3-lista .it::before{\n  counter-increment: paso;\n  content: counter(paso) \".\";\n  left: 0;\n  font-family: var(--serif);\n  font-size: calc(12.4px * var(--p3-fs, 1));\n  line-height: 1.36;\n  color: var(--mut);\n}\n\n/* Nuestro consejo: bloque invertido dentro de la columna. */\n.p3-consejo{\n  padding: 13px 18px 14px;\n  background: var(--navy);\n  color: var(--sobre-navy);\n}\n.p3-consejo .p3-h3{\n  color: var(--sobre-navy-mut);\n  border-bottom-color: rgba(255,255,255,.28);\n}\n.p3-consejo .p3-p{\n  font-style: italic;\n  font-size: calc(12.4px * var(--p3-fs, 1));\n  line-height: 1.46;\n  text-align: left;          /* §10.7 — cursiva justificada = ríos */\n  hyphens: none;\n  color: var(--sobre-navy);\n}\n\n/* ---- 5. Pie a sangre ------------------------------------------------------ */\n.p3-pie{\n  flex: 0 0 58px;\n  min-height: 0;\n  margin: 0 -52px;\n  padding: 0 52px;\n  background: var(--navy-2);\n  color: var(--sobre-navy);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 20px;\n}\n.p3-pie-entrada{\n  margin: 0;\n  font-size: 10.5px;\n  line-height: 1.45;\n  color: var(--sobre-navy-mut);\n}\n.p3-pie-firma{\n  margin: 0;\n  font-size: 12px;\n  font-weight: 700;\n  line-height: 1.45;\n}\n.p3-pie-correos{\n  margin: 0;\n  font-size: 11.5px;\n  line-height: 1.45;\n  color: var(--sobre-navy-mut);\n  white-space: nowrap;\n}\n\n\n/* ==== plantilla-4.css ==== */\n/* ==========================================================================\n   plantilla-4.css — Tablero · 1400 × 640 (banda ancha para el cuerpo del correo)\n\n   Trampas de la §10 aplicadas:\n   · (1) La foto va como background-size:cover sobre un contenedor de altura\n         fija (110px). Nada de <img height:100%>.\n   · (2) min-height:0 en las celdas y en los hijos del riel.\n   · (3) Las listas reparten la altura con ul{flex:1} + li{flex:1} y hairlines.\n   · (4) Las viñetas absolutas van a top:50% con translateY(-50%); el rombo\n         escribe rotate y translate en la MISMA declaración.\n   · (5) La fila 1 sobrescribe explícitamente el flex-direction:column que\n         hereda de .p4-celda. Sin eso el título sale centrado arriba.\n   ========================================================================== */\n\n.p4{\n  width: 100%;\n  height: 100%;\n  display: flex;\n  background: var(--hoja-bg);\n  color: var(--ink);\n  font-family: var(--sans);\n}\n\n.p4 .blk{ position: relative; }\n.p4 .lista{ margin: 0; padding: 0; list-style: none; }\n\n/* ---- 1. Riel izquierdo ---------------------------------------------------- */\n.p4-riel{\n  flex: 0 0 376px;\n  min-width: 0;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  padding: 0 34px;\n  background: var(--navy);\n  color: var(--sobre-navy);\n}\n\n.p4-foto{\n  position: relative;\n  flex: 0 0 110px;\n  min-height: 0;\n  margin: 0 -34px;\n  overflow: hidden;\n  background-color: var(--navy);\n  background-size: cover;\n  background-position: center 46%;   /* mismo motivo que en la plantilla 1 */\n  background-repeat: no-repeat;\n}\n.p4-velo{\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(180deg, rgba(var(--navy-rgb),.35) 0%, rgba(var(--navy-rgb),.85) 55%, var(--navy) 100%);\n}\n\n.p4-riel-tx{\n  position: relative;\n  z-index: 2;\n  margin-top: -30px;\n  min-height: 0;\n}\n.p4-kicker{\n  display: block;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--sobre-navy-mut);\n}\n.p4-art{\n  display: block;\n  margin: 6px 0 4px;\n  font-size: 44px;\n  font-weight: 700;\n  line-height: 1.05;\n  letter-spacing: -.02em;\n  white-space: nowrap;\n}\n.p4-ord{\n  display: block;\n  font-size: 13px;\n  line-height: 1.3;\n  color: var(--sobre-navy);\n  opacity: .88;\n}\n.p4-gancho{\n  margin: 16px 0 0;\n  padding-left: 13px;\n  border-left: 3px solid var(--acc);\n  font-size: 12.6px;\n  line-height: 1.5;\n  color: var(--sobre-navy);\n}\n\n.p4-consejo{\n  margin: auto -34px 0;\n  padding: 14px 34px 15px;\n  background: rgba(255,255,255,.07);\n  min-height: 0;\n}\n.p4-consejo-etq{\n  margin: 0 0 6px;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  line-height: 1.3;\n  color: var(--sobre-navy-mut);\n}\n.p4-consejo-tx{\n  margin: 0;\n  font-size: 11.6px;\n  line-height: 1.46;\n  color: var(--sobre-navy);\n}\n\n.p4-contacto{\n  margin: 0 -34px;\n  padding: 12px 34px 13px;\n  background: var(--navy-hondo);\n  min-height: 0;\n}\n.p4-pie-entrada{\n  margin: 0;\n  font-size: 10px;\n  line-height: 1.4;\n  color: var(--sobre-navy-mut);\n}\n.p4-pie-firma{\n  margin: 6px 0 0;\n  font-size: 12px;\n  font-weight: 700;\n  line-height: 1.35;\n}\n.p4-pie-correos{\n  margin: 2px 0 0;\n  font-size: 11px;\n  line-height: 1.35;\n  color: var(--sobre-navy-mut);\n}\n\n/* ---- 2. Rejilla derecha ---------------------------------------------------\n   El gap de 1px sobre el fondo --rule es lo que dibuja las divisorias: no hay\n   borders que cuadrar entre celdas. */\n.p4-rejilla{\n  flex: 1;\n  min-width: 0;\n  min-height: 0;\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  grid-template-rows: auto 1fr auto;\n  gap: 1px;\n  background: var(--rule);\n}\n\n.p4-celda{\n  display: flex;\n  flex-direction: column;\n  min-width: 0;\n  min-height: 0;\n  padding: 16px 22px;\n  background: var(--hoja-bg);\n}\n\n.p4-num{\n  display: block;\n  font-family: var(--serif);\n  font-size: 17px;\n  line-height: 1.1;\n  color: var(--acc);\n}\n.p4-num-claro{ color: var(--sobre-navy-mut); }\n\n.p4-h3{\n  margin: 4px 0 0;\n  font-size: 13.5px;\n  font-weight: 700;\n  line-height: 1.25;\n  color: var(--navy);\n}\n.tono-riesgo .p4-h3{ color: var(--navy); }\n.p4-entrada{\n  margin: 4px 0 0;\n  font-size: 11.5px;\n  font-style: italic;\n  line-height: 1.4;\n  color: var(--mut);\n  text-align: left;          /* §10.7 */\n}\n\n/* --- Fila 1: rótulo y párrafo en horizontal, a las tres columnas ---------- */\n.p4-rejilla > .p4-fila1{\n  grid-column: 1 / -1;\n  flex-direction: row;       /* §10.5 — pisa el column de .p4-celda */\n  align-items: flex-start;\n  gap: 24px;\n  background: var(--soft);\n  color: var(--sobre-soft);\n}\n.p4-fila1-etq{ flex: 0 0 215px; min-width: 0; }\n.p4-p{\n  flex: 1;\n  min-width: 0;\n  margin: 0;\n  font-size: 12.6px;\n  line-height: 1.5;\n  color: var(--ink);\n}\n\n/* --- Fila 2: tres celdas con su lista repartida a lo alto ----------------- */\n.p4-celda-lista .p4-lista{\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  margin-top: 10px;\n}\n.p4-celda-lista .it{\n  flex: 1;\n  min-height: 0;\n  position: relative;\n  display: flex;\n  align-items: center;\n  padding: 4px 0 4px 20px;\n  border-bottom: 1px solid var(--rule);\n  font-size: 12.2px;\n  line-height: 1.4;\n  color: var(--ink);\n}\n.p4-celda-lista .it:last-child{ border-bottom: 0; }\n\n/* §10.4 — centrada sobre el alto del ítem, no colgada de la primera línea.\n   El rombo compone rotate y translate en una sola declaración. */\n.p4 .p4-celda-lista .it::before{\n  position: absolute;\n  left: 0;\n  top: 50%;\n}\n.p4 .p4-celda-lista .it::before{ content: \"\"; }\n.p4-celda-lista{ --vineta: var(--acc); }\n.p4-celda-lista.tono-riesgo{ --vineta: var(--bad); }\n.p4-celda-lista.tono-recomendacion{ --vineta: var(--ok); }\n\n.p4 .p4-celda-lista .it::before{\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: var(--vineta);\n  transform: translateY(-50%);\n}\n.p4 .tono-riesgo .it::before{\n  border-radius: 0;\n  transform: translateY(-50%) rotate(45deg);\n}\n.p4 .tono-recomendacion .it::before{\n  content: \"✓\";\n  width: auto;\n  height: auto;\n  background: none;\n  font-size: 12.5px;\n  font-weight: 700;\n  line-height: 1;\n  color: var(--vineta);\n  transform: translateY(-50%);\n}\n\n/* --- Fila 3: franja de apoyo --------------------------------------------- */\n.p4-rejilla > .p4-fila3{\n  grid-column: 1 / -1;\n  display: flex;\n  align-items: center;\n  gap: 22px;\n  padding: 13px 22px;\n  background: var(--navy-2);\n  color: var(--sobre-navy);\n  min-width: 0;\n}\n.p4-fila3-etq{ flex: 0 0 152px; min-width: 0; }\n.p4-fila3 .p4-h3{\n  display: inline;\n  font-size: 11px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--sobre-navy);\n}\n.p4-fila3 .p4-num{\n  display: inline;\n  font-family: var(--sans);\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: .1em;\n}\n.p4-fila3 .p4-num::after{ content: \" · \"; }\n.p4-fila3 .p4-entrada{ color: var(--sobre-navy-mut); font-size: 10.5px; opacity: .9; }\n\n.p4-apoyo-lista{\n  flex: 1;\n  min-width: 0;\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 4px 20px;\n}\n.p4-apoyo-lista .it{\n  position: relative;\n  padding-left: 14px;\n  font-size: 11.5px;\n  line-height: 1.4;\n}\n.p4 .p4-apoyo-lista .it::before{\n  content: \"›\";\n  position: absolute;\n  left: 0;\n  top: 0;\n  font-size: 13px;\n  font-weight: 700;\n  line-height: 1.25;\n  color: var(--sobre-navy-mut);\n}\n\n.p4-celda-lista .agregar-vineta.dentro{ right: 6px; bottom: 4px; }\n.p4-fila3 .agregar-vineta.dentro{ right: 6px; bottom: 2px; }\n\n\n/* ==== print.css ==== */\n/* ==========================================================================\n   print.css — impresión a PDF. Cada plantilla, una sola página.\n\n   La regla @page no se puede condicionar con un selector, así que el tamaño\n   y la orientación los inyecta exportar.js justo antes de imprimir según la\n   plantilla activa (ver Exportar.reglaPagina). Aquí van las reglas que sí\n   admiten selector, y el @page por defecto (carta), que es el de las\n   plantillas 1 y 3.\n\n   Dos decisiones que conviene no deshacer sin saber por qué están:\n\n   · margin: 0 en TODAS las plantillas. El navegador dibuja su encabezado y su\n     pie (fecha, título de la pestaña, URL, número de página) dentro del margen\n     de página. Sin margen no tiene dónde ponerlos. Esto es lo que el contador\n     leía como \"marcas de agua de insuser\": era la URL del sitio, no el\n     documento. El interruptor definitivo sigue siendo la casilla\n     \"Encabezados y pies de página\" del diálogo de impresión, que es del\n     navegador y no se puede tocar desde CSS.\n\n   · Carta, no A4. El despacho imprime en Carta. Las hojas apaisadas se\n     dimensionan además para caber también en A4 apaisada (1056 × 793 px es la\n     intersección de ambos papeles), así que salen en una sola página con\n     cualquiera de los dos.\n   ========================================================================== */\n\n@page{ size: letter; margin: 0; }\n\n@media print{\n\n  .no-print{ display: none !important; }\n\n  html, body{\n    margin: 0;\n    padding: 0;\n    background: #fff;\n  }\n\n  .lienzo{\n    display: block;\n    padding: 0;\n    min-height: 0;\n    overflow: visible;\n  }\n\n  .envoltorio{\n    width: auto !important;\n    height: auto !important;\n  }\n\n  /* El escalado de ajuste a pantalla no debe llegar al papel. */\n  .hoja{\n    transform: none !important;\n    box-shadow: none !important;\n    margin: 0;\n  }\n\n  /* Sin affordances de edición en el papel. */\n  .hoja .solo-edicion{ display: none !important; }\n  .hoja [contenteditable]{ outline: none !important; background: none !important; }\n\n  /* Los fondos de color son el diseño, no decoración de pantalla. */\n  *{\n    -webkit-print-color-adjust: exact !important;\n    print-color-adjust: exact !important;\n  }\n\n  /* --- Plantilla 1 · Ejecutivo vertical -----------------------------------\n     816 × 1056 px = 8.5 × 11 in exactos a 96 dpi: no hace falta escalar.\n     Fijar el tamaño de html y body evita que Chrome saque una segunda\n     página en blanco. */\n  html.imprimir-1, html.imprimir-1 body{\n    width: 816px;\n    height: 1056px;\n    overflow: hidden;\n  }\n  html.imprimir-1 .hoja{ width: 816px; height: 1056px; }\n\n  /* --- Plantilla 2 · Procedimiento horizontal -----------------------------\n     1400 × 1000 no cabe en Carta apaisada: se reduce al 72 % → 1008 × 720.\n     El margen la centra en la página. html y body se fijan al tamaño de papel\n     (1056 × 793) porque la caja de maquetación de .hoja sigue midiendo\n     1400 × 1000 aunque el transform la dibuje más chica: sin overflow:hidden\n     Chrome saca una segunda página en blanco. */\n  html.imprimir-2 .hoja{\n    width: 1400px;\n    height: 1000px;\n    transform: scale(.72) !important;\n    transform-origin: top left;\n    margin: 36px 0 0 24px;\n  }\n  html.imprimir-2, html.imprimir-2 body{\n    width: 1056px;\n    height: 793px;\n    overflow: hidden;\n  }\n\n  /* --- Plantilla 3 · Editorial — 816 × 1056 = carta exacta ---------------- */\n  html.imprimir-3, html.imprimir-3 body{\n    width: 816px;\n    height: 1056px;\n    overflow: hidden;\n  }\n  html.imprimir-3 .hoja{ width: 816px; height: 1056px; }\n\n  /* --- Plantilla 4 · Tablero — 1400 × 640 al 72 % → 1008 × 461 ------------\n     Es una banda: sobra alto, así que va centrada verticalmente. */\n  html.imprimir-4 .hoja{\n    width: 1400px;\n    height: 640px;\n    transform: scale(.72) !important;\n    transform-origin: top left;\n    margin: 166px 0 0 24px;\n  }\n  html.imprimir-4, html.imprimir-4 body{\n    width: 1056px;\n    height: 793px;\n    overflow: hidden;\n  }\n}\n";

/* ==========================================================================
   plantillas.js — el estado vive en el objeto de datos; aquí solo se pinta.
   Cada nodo editable lleva data-campo="<ruta>" y el editor escribe de vuelta
   en esa ruta. Por eso cambiar de plantilla nunca pierde texto.

   Rutas admitidas:
     gancho                      foto
     meta.kicker | meta.mes | meta.articulo | meta.ordenamiento | meta.subtitulo
     meta.plazo.numero | meta.plazo.unidad
     pie.entrada | pie.firma | pie.correos
     sec.<id>.titulo | sec.<id>.texto | sec.<id>.entrada | sec.<id>.items.<i>
   ========================================================================== */

var Datos = (function () {

  function clonar(o) { return JSON.parse(JSON.stringify(o)); }

  function seccion(d, id) {
    for (var i = 0; i < d.secciones.length; i++) if (d.secciones[i].id === id) return d.secciones[i];
    return null;
  }

  /* Devuelve { obj, clave } para poder leer y escribir en la misma ruta. */
  function resolver(d, ruta) {
    var p = String(ruta).split('.'), obj = d, i = 0;
    if (p[0] === 'sec') { obj = seccion(d, p[1]); i = 2; }
    for (; i < p.length - 1 && obj != null; i++) obj = obj[p[i]];
    return obj == null ? null : { obj: obj, clave: p[p.length - 1] };
  }

  function leer(d, ruta) { var r = resolver(d, ruta); return r ? r.obj[r.clave] : ''; }

  /* Escribir nunca debe CREAR posiciones en una lista: si la ruta trae un
     índice fuera de rango es que venía de un nodo caduco (la lista se repintó
     entre medias) y aplicarla resucitaría una viñeta ya eliminada. */
  function escribir(d, ruta, valor) {
    var r = resolver(d, ruta);
    if (!r) return false;
    if (Array.isArray(r.obj)) {
      var i = parseInt(r.clave, 10);
      if (!(i >= 0 && i < r.obj.length)) return false;
    }
    r.obj[r.clave] = valor;
    return true;
  }

  /* Formatos de presentación: el dato se guarda íntegro, la plantilla lo muestra
     recortado. "numeral" convierte "Artículo 49 Bis" en "49 Bis" para el bloque
     grande del hero, y al guardar vuelve a anteponer "Artículo ". Ningún carácter
     del contenido se pierde. */
  var FORMATOS = {
    numeral: {
      mostrar: function (v) { return String(v).replace(/^Art[íi]culo\s+/i, ''); },
      guardar: function (v, previo) {
        return /^Art[íi]culo\s+/i.test(String(previo)) ? 'Artículo ' + v : v;
      }
    }
  };

  return {
    clonar: clonar, seccion: seccion, leer: leer, escribir: escribir, FORMATOS: FORMATOS,
    mostrar: function (d, ruta, formato) {
      var v = leer(d, ruta);
      return formato && FORMATOS[formato] ? FORMATOS[formato].mostrar(v) : v;
    }
  };

     cambia cada mes), sobra material y el navegador lo manda a una TERCERA
     columna que cae fuera de la hoja: el texto desaparece sin avisar.

     La §5 dice que si no cabe se ajusta la tipografía, no se recorta el texto.
     Eso es exactamente lo que hace esto: baja el cuerpo de 2 en 2 % hasta que
     las dos columnas lo absorben. Devuelve el factor aplicado para que la
     aplicación pueda avisar si hubo que apretar demasiado.
     -------------------------------------------------------------------------- */
  function ajustarEditorial(hoja) {
    var cuerpo = hoja.querySelector('.p3-cuerpo');
    if (!cuerpo) return 1;
    var f = 1;
    cuerpo.style.setProperty('--p3-fs', '1');
    // scrollWidth > clientWidth significa que se abrió una columna de más.
    while (f > 0.78 && cuerpo.scrollWidth > cuerpo.clientWidth + 1) {
      f = Math.round((f - 0.02) * 100) / 100;
      cuerpo.style.setProperty('--p3-fs', String(f));
    }
    return f;
  }

     -------------------------------------------------------------------------- */
  function ajustarEjecutivo(hoja) {
    var cuerpo = hoja.querySelector('.p1-cuerpo');
    if (!cuerpo) return 1;
    var f = 1;
    cuerpo.style.setProperty('--p1-fs', '1');
    function rebasa() {
      var ultimo = cuerpo.lastElementChild;
      if (!ultimo) return false;
      return ultimo.getBoundingClientRect().bottom > cuerpo.getBoundingClientRect().bottom + 0.6;
    }
    while (f > 0.78 && rebasa()) {
      f = Math.round((f - 0.02) * 100) / 100;
      cuerpo.style.setProperty('--p1-fs', String(f));
    }
    return f;
  }

  var REGISTRO = {
    '1': { nombre: 'Ejecutivo vertical',       ancho: 816,  alto: 1056, foto: true,
           orientacion: 'vertical',   render: plantilla1, ajustar: ajustarEjecutivo },
    '2': { nombre: 'Procedimiento horizontal', ancho: 1400, alto: 1000, foto: false,
           orientacion: 'horizontal', render: plantilla2 },
    '3': { nombre: 'Editorial',                ancho: 816,  alto: 1056, foto: false,
           orientacion: 'vertical',   render: plantilla3, ajustar: ajustarEditorial },
    '4': { nombre: 'Tablero',                  ancho: 1400, alto: 640,  foto: true,
           orientacion: 'banda',      render: plantilla4 }
  };

  return {
    registro: REGISTRO,
    esc: esc,
    campo: campo,
    lista: lista,
    botonAgregar: botonAgregar,
    obtener: function (id) { return REGISTRO[String(id)]; },
    listar: function () { return Object.keys(REGISTRO); }
  };
})();

/* ==== editor.js ==== */
/* ==========================================================================
   editor.js — edición in-place sobre el diseño.
   Todo lo que se escribe acaba en el objeto de datos: la plantilla solo pinta.
   ========================================================================== */

var Editor = (function () {

  var ctx = null;          // { hoja, datos(), repintar(), cambio() }
  var temporizador = null;
  var pendiente = null;

  /* ---- lectura del nodo editable ----------------------------------------
     textContent, NO innerText: innerText devuelve el texto tal como se ve, ya
     pasado por text-transform. Los h3 van en versalitas por CSS, as\u00ed que con
     innerText el modelo acabar\u00eda guardando "\u00bfQU\u00c9 ES EL ART\u00cdCULO 49 BIS?" y ese
     destrozo viajar\u00eda a las dem\u00e1s plantillas. Como Enter est\u00e1 bloqueado, no hay
     saltos de l\u00ednea que innerText tuviera que resolver. */
  function valorDe(nodo) {
    return String(nodo.textContent)
      .replace(/\u00a0/g, ' ').replace(/\s*\r?\n\s*/g, ' ').trim();
  }

  function guardarNodo(nodo) {
    if (!nodo || !nodo.getAttribute) return;
    // Un nodo ya desprendido del documento tiene una ruta caduca: si la lista
    // se repint\u00f3, su \u00edndice puede apuntar a un elemento que ya no existe.
    if (nodo.isConnected === false) return;
    var ruta = nodo.getAttribute('data-campo');
    if (!ruta) return;
    var formato = nodo.getAttribute('data-formato');
    var texto = valorDe(nodo);
    var previo = Datos.leer(ctx.datos(), ruta);
    var valor = (formato && Datos.FORMATOS[formato])
      ? Datos.FORMATOS[formato].guardar(texto, previo)
      : texto;
    Datos.escribir(ctx.datos(), ruta, valor);
    if (ctx.cambio) ctx.cambio();
  }

  /* Un mismo campo puede aparecer en dos sitios (p. ej. la firma sale en la
     banda superior y en el pie). Al soltar el foco se igualan. */
  function sincronizarGemelos(nodo) {
    var ruta = nodo.getAttribute('data-campo');
    if (!ruta) return;
    var d = ctx.datos();
    var iguales = ctx.hoja.querySelectorAll('[data-campo="' + ruta + '"]');
    for (var i = 0; i < iguales.length; i++) {
      if (iguales[i] === nodo) continue;
      var f = iguales[i].getAttribute('data-formato');
      iguales[i].textContent = Datos.mostrar(d, ruta, f);
    }
  }

  /* Vuelca al modelo lo que haya en vuelo ANTES de tocar la estructura de una
     lista. Además suelta el foco: si un campo sigue enfocado cuando se repinta,
     su blur llegaría después del repintado, con un índice que ya no existe. */
  function volcarPendiente() {
    if (temporizador) { clearTimeout(temporizador); temporizador = null; }
    if (pendiente) { guardarNodo(pendiente); pendiente = null; }
    var activo = document.activeElement;
    if (activo && activo !== document.body && ctx.hoja.contains(activo) &&
        activo.getAttribute && activo.getAttribute('data-campo')) {
      guardarNodo(activo);
      activo.blur();
    }
  }

  /* ---- alta y baja de viñetas ------------------------------------------- */
  function rutaLista(rutaItem) {
    var m = String(rutaItem).match(/^(.*)\.(\d+)$/);
    return m ? { lista: m[1], indice: parseInt(m[2], 10) } : null;
  }

  function agregarVineta(ruta) {
    volcarPendiente();
    var arreglo = Datos.leer(ctx.datos(), ruta);
    if (!arreglo || !arreglo.push) return;
    arreglo.push('Nueva viñeta');
    ctx.repintar();
    if (ctx.cambio) ctx.cambio();
    var nuevo = ctx.hoja.querySelector('[data-campo="' + ruta + '.' + (arreglo.length - 1) + '"]');
    if (nuevo) { nuevo.focus(); seleccionarTodo(nuevo); }
  }

  function quitarVineta(rutaItem) {
    volcarPendiente();
    var r = rutaLista(rutaItem);
    if (!r) return;
    var arreglo = Datos.leer(ctx.datos(), r.lista);
    if (!arreglo || arreglo.length <= 1) return;   // nunca dejar la lista vacía
    arreglo.splice(r.indice, 1);
    ctx.repintar();
    if (ctx.cambio) ctx.cambio();
  }

  function seleccionarTodo(nodo) {
    try {
      var rango = document.createRange();
      rango.selectNodeContents(nodo);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(rango);
    } catch (e) { /* sin selección: no es crítico */ }
  }

  /* ---- fotografía -------------------------------------------------------- */
  function cambiarFoto() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.addEventListener('change', function () {
      var archivo = inp.files && inp.files[0];
      if (!archivo) return;
      var lector = new FileReader();
      lector.onload = function () {
        ctx.datos().foto = lector.result;
        ctx.repintar();
        if (ctx.cambio) ctx.cambio();
      };
      lector.readAsDataURL(archivo);
    });
    inp.click();
  }

  /* ---- modo edición ------------------------------------------------------ */
  function aplicarModo(editando) {
    ctx.hoja.classList.toggle('editando', !!editando);
    var campos = ctx.hoja.querySelectorAll('[data-campo]');
    for (var i = 0; i < campos.length; i++) {
      if (editando) {
        campos[i].setAttribute('contenteditable', 'true');
        campos[i].setAttribute('spellcheck', 'false');
      } else {
        campos[i].removeAttribute('contenteditable');
        campos[i].removeAttribute('spellcheck');
      }
    }
  }

  /* ---- cableado ---------------------------------------------------------- */
  function conectar() {
    var hoja = ctx.hoja;

    hoja.addEventListener('input', function (e) {
      var n = e.target;
      if (!n.getAttribute || !n.getAttribute('data-campo')) return;
      pendiente = n;
      if (temporizador) clearTimeout(temporizador);
      temporizador = setTimeout(function () { temporizador = null; guardarNodo(n); pendiente = null; }, 300);
    });

    // blur no burbujea: hay que escucharlo en captura.
    hoja.addEventListener('blur', function (e) {
      var n = e.target;
      if (!n.getAttribute || !n.getAttribute('data-campo')) return;
      if (pendiente === n) { if (temporizador) clearTimeout(temporizador); temporizador = null; pendiente = null; }
      guardarNodo(n);
      sincronizarGemelos(n);
    }, true);

    // Pegar siempre como texto plano: Word inyecta <span style="font-family:Calibri">
    // y rompe el diseño.
    hoja.addEventListener('paste', function (e) {
      var n = e.target;
      if (!n.getAttribute || !n.getAttribute('data-campo')) return;
      e.preventDefault();
      var dt = e.clipboardData || window.clipboardData;
      var texto = dt ? dt.getData('text/plain') : '';
      texto = String(texto).replace(/\s*\r?\n\s*/g, ' ');
      document.execCommand('insertText', false, texto);
    });

    hoja.addEventListener('drop', function (e) {
      var n = e.target;
      if (n.getAttribute && n.getAttribute('data-campo')) e.preventDefault();
    });

    hoja.addEventListener('keydown', function (e) {
      var n = e.target;
      if (!n.getAttribute || !n.getAttribute('data-campo')) return;
      // Los campos son cadenas de texto: ni saltos de línea ni negritas sueltas.
      if (e.key === 'Enter') { e.preventDefault(); n.blur(); return; }
      if ((e.ctrlKey || e.metaKey) && /^[biu]$/i.test(e.key)) e.preventDefault();
    });

    hoja.addEventListener('click', function (e) {
      var quitar = e.target.closest && e.target.closest('[data-quitar]');
      if (quitar) { e.preventDefault(); quitarVineta(quitar.getAttribute('data-quitar')); return; }
      var agregar = e.target.closest && e.target.closest('[data-agregar]');
      if (agregar) { e.preventDefault(); agregarVineta(agregar.getAttribute('data-agregar')); return; }
      if (!hoja.classList.contains('editando')) return;
      var foto = e.target.closest && e.target.closest('[data-foto]');
      if (foto && !(e.target.getAttribute && e.target.getAttribute('data-campo'))) cambiarFoto();
    });
  }

  return {
    iniciar: function (contexto) { ctx = contexto; conectar(); },
    aplicarModo: aplicarModo,
    volcarPendiente: volcarPendiente,
    cambiarFoto: cambiarFoto
  };
})();

/* ==== exportar.js ==== */
/* ==========================================================================
   exportar.js — PNG e impresión a PDF.
   Lo que se ve es lo que se exporta: antes de capturar se quita el modo edición
   y el escalado de ajuste a pantalla, y después se restauran.
   ========================================================================== */

var Exportar = (function () {

  var ctx = null;   // { hoja, envoltorio, estado(), ajustar(), aviso() }

  function hayHtml2canvas() { return typeof window.html2canvas === 'function'; }

  /* Deja la hoja en estado "limpio" (sin edición ni escalado), ejecuta la
     tarea y restaura. La tarea puede devolver una promesa. */
  function conHojaLimpia(tarea) {
    var hoja = ctx.hoja;
    var editaba = hoja.classList.contains('editando');
    var transformPrevio = hoja.style.transform;
    var anchoPrevio = ctx.envoltorio.style.width;
    var altoPrevio = ctx.envoltorio.style.height;

    if (editaba) Editor.aplicarModo(false);
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    hoja.style.transform = 'none';
    ctx.envoltorio.style.width = hoja.offsetWidth + 'px';
    ctx.envoltorio.style.height = hoja.offsetHeight + 'px';

    function restaurar() {
      hoja.style.transform = transformPrevio;
      ctx.envoltorio.style.width = anchoPrevio;
      ctx.envoltorio.style.height = altoPrevio;
      if (editaba) Editor.aplicarModo(true);
      ctx.ajustar();
    }

    var r;
    try { r = tarea(); }
    catch (e) { restaurar(); throw e; }

    if (r && typeof r.then === 'function') {
      return r.then(function (v) { restaurar(); return v; },
                    function (e) { restaurar(); throw e; });
    }
    restaurar();
    return Promise.resolve(r);
  }

  function nombreArchivo(ext) {
    var e = ctx.estado();
    var mes = String(e.contenido.meta.mes || 'boletin')
      .toLowerCase()
      .replace(/[áä]/g, 'a').replace(/[éë]/g, 'e').replace(/[íï]/g, 'i')
      .replace(/[óö]/g, 'o').replace(/[úü]/g, 'u').replace(/ñ/g, 'n')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return 'boletin-' + mes + '-plantilla-' + e.plantilla + '.' + ext;
  }

  function descargar(url, nombre) {
    var a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function png() {
    if (!hayHtml2canvas()) {
      ctx.aviso('No se pudo cargar la biblioteca de exportación (requiere internet). Use Imprimir / PDF.', 'error');
      return Promise.resolve(false);
    }
    ctx.aviso('Generando PNG…');
    return conHojaLimpia(function () {
      return window.html2canvas(ctx.hoja, {
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false
      }).then(function (lienzo) {
        descargar(lienzo.toDataURL('image/png'), nombreArchivo('png'));
        return true;
      });
    }).then(function (ok) {
      ctx.aviso(ok ? 'PNG descargado.' : '', 'ok');
      return ok;
    }, function (e) {
      ctx.aviso('No se pudo generar el PNG: ' + (e && e.message ? e.message : e), 'error');
      return false;
    });
  }

  /* @page no admite selectores: la regla de tamaño y orientación se inyecta
     según la plantilla activa justo antes de imprimir. La clase imprimir-N en
     <html> activa además las reglas con selector de print.css. */
  /* margin:0 en las cuatro: el margen de página es donde el navegador dibuja
     su encabezado y su pie (fecha, título, URL, número de página). Sin margen
     no caben. Carta porque es el papel del despacho; las apaisadas están
     dimensionadas para caber también en A4 apaisada. */
  var REGLAS_PAGINA = {
    '1': '@page{ size: letter; margin: 0; }',
    '2': '@page{ size: letter landscape; margin: 0; }',
    '3': '@page{ size: letter; margin: 0; }',
    '4': '@page{ size: letter landscape; margin: 0; }'
  };

  function reglaPagina(plantilla) {
    var id = 'regla-pagina';
    var n = document.getElementById(id);
    if (!n) { n = document.createElement('style'); n.id = id; document.head.appendChild(n); }
    n.textContent = REGLAS_PAGINA[String(plantilla)] || REGLAS_PAGINA['1'];
    var raiz = document.documentElement;
    raiz.className = raiz.className.replace(/\bimprimir-\d\b/g, '').replace(/\s+/g, ' ').trim();
    raiz.classList.add('imprimir-' + plantilla);
  }

  function imprimir() {
    var hoja = ctx.hoja;
    var editaba = hoja.classList.contains('editando');
    if (editaba) Editor.aplicarModo(false);
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    reglaPagina(ctx.estado().plantilla);
    window.print();
    if (editaba) Editor.aplicarModo(true);
  }

  /* ======================================================================
     Guardar y cargar
     ====================================================================== */

  var CLAVE_BORRADOR = 'boletin:borrador';
  var VERSION = 1;

  function revisionActual() {
    return (typeof CONTENIDO_REVISION === 'string') ? CONTENIDO_REVISION : null;
  }

  function instantanea() {
    var e = ctx.estado();
    return {
      version: VERSION,
      revision: revisionActual(),   // contra qué texto base se editó esto
      plantilla: e.plantilla,
      tema: e.tema,
      contenido: e.contenido
    };
  }

  function guardarJSON() {
    Editor.volcarPendiente();
    var texto = JSON.stringify(instantanea(), null, 2);
    var blob = new Blob([texto], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    descargar(url, nombreArchivo('json').replace(/-plantilla-\d/, ''));
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    ctx.aviso('Boletín guardado en JSON.', 'ok');
  }

  /* Validación mínima: un JSON de otro programa no debe dejar la app en un
     estado a medias. O trae las 6 secciones y el pie, o no se carga. */
  function valido(o) {
    if (!o || typeof o !== 'object' || !o.contenido) return false;
    var c = o.contenido;
    return !!(c.meta && c.pie && typeof c.gancho === 'string' &&
              Array.isArray(c.secciones) && c.secciones.length &&
              c.secciones.every(function (s) { return s && s.id && s.titulo; }));
  }

  function cargarJSON(archivo, alCargar) {
    var lector = new FileReader();
    lector.onload = function () {
      var o;
      try { o = JSON.parse(lector.result); }
      catch (e) { ctx.aviso('El archivo no es un JSON válido.', 'error'); return; }
      if (!valido(o)) { ctx.aviso('El archivo no es un boletín guardado por esta aplicación.', 'error'); return; }
      alCargar(o);
      ctx.aviso('Boletín cargado.', 'ok');
    };
    lector.onerror = function () { ctx.aviso('No se pudo leer el archivo.', 'error'); };
    lector.readAsText(archivo);
  }

  /* CSS de la aplicación. Servida por HTTP se lee el vivo; en file:// Chrome
     bloquea cssRules con SecurityError y se usa la copia que genera build.mjs. */
  function css() {
    var partes = [], vivo = true;
    for (var i = 0; i < document.styleSheets.length; i++) {
      try {
        var reglas = document.styleSheets[i].cssRules;
        for (var j = 0; j < reglas.length; j++) partes.push(reglas[j].cssText);
      } catch (e) { vivo = false; break; }
    }
    if (vivo && partes.length) return partes.join('\n');
    return (typeof ESTILOS_EMBEBIDOS === 'string') ? ESTILOS_EMBEBIDOS : null;
  }

  /* Entregable congelado: la hoja tal cual se ve, sin barra y sin edición. */
  function guardarHTML() {
    Editor.volcarPendiente();
    var hojas = css();
    if (!hojas) {
      ctx.aviso('Falta js/estilos.js: ejecute "node build.mjs" una vez para poder guardar HTML.', 'error');
      return;
    }
    var e = ctx.estado();
    var clon = ctx.hoja.cloneNode(true);
    clon.classList.remove('editando');
    clon.style.transform = '';
    clon.removeAttribute('style');
    clon.style.margin = '0 auto';
    var quitar = clon.querySelectorAll('.solo-edicion');
    for (var i = 0; i < quitar.length; i++) quitar[i].parentNode.removeChild(quitar[i]);
    var editables = clon.querySelectorAll('[contenteditable]');
    for (var k = 0; k < editables.length; k++) {
      editables[k].removeAttribute('contenteditable');
      editables[k].removeAttribute('spellcheck');
    }
    var p = Plantillas.obtener(e.plantilla);
    clon.style.width = p.ancho + 'px';
    clon.style.height = p.alto + 'px';

    var doc = '<!doctype html>\n<html lang="es-MX">\n<head>\n<meta charset="utf-8">\n' +
      '<title>Boletín fiscal · ' + Plantillas.esc(e.contenido.meta.mes) + '</title>\n' +
      '<style>\n' + hojas + '\n' +
      'body{margin:0;background:#f2f4f7;display:flex;justify-content:center;' +
      'align-items:flex-start;padding:24px}\n' +
      '@media print{body{background:#fff;padding:0;display:block}}\n' +
      '</style>\n</head>\n<body class="imprimir-' + e.plantilla + '">\n' +
      clon.outerHTML + '\n</body>\n</html>\n';

    var blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    descargar(url, nombreArchivo('html'));
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    ctx.aviso('HTML guardado (hoja congelada, sin barra ni edición).', 'ok');
  }

  /* §10.6 — localStorage puede no existir en file:// con configuraciones
     estrictas. Todo va envuelto y se degrada en silencio al JSON manual. */
  function autoguardar() {
    try { localStorage.setItem(CLAVE_BORRADOR, JSON.stringify(instantanea())); return true; }
    catch (e) { return false; }
  }

  function leerBorrador() {
    try {
      var s = localStorage.getItem(CLAVE_BORRADOR);
      if (!s) return null;
      var o = JSON.parse(s);
      return valido(o) ? o : null;
    } catch (e) { return null; }
  }

  function borrarBorrador() {
    try { localStorage.removeItem(CLAVE_BORRADOR); } catch (e) { /* da igual */ }
  }

  return {
    iniciar: function (contexto) { ctx = contexto; },
    hayHtml2canvas: hayHtml2canvas,
    conHojaLimpia: function (t) { return conHojaLimpia(t); },
    reglaPagina: reglaPagina,
    png: png,
    imprimir: imprimir,
    revisionActual: revisionActual,
    /* Vuelve a sellar el borrador con la revisión de hoy, para que el aviso de
       "el texto base cambió" no reaparezca si el usuario decide conservarlo. */
    sellarBorrador: function () {
      var b = leerBorrador();
      if (!b) return false;
      b.revision = revisionActual();
      try { localStorage.setItem(CLAVE_BORRADOR, JSON.stringify(b)); return true; }
      catch (e) { return false; }
    },
    guardarJSON: guardarJSON,
    cargarJSON: cargarJSON,
    guardarHTML: guardarHTML,
    autoguardar: autoguardar,
    leerBorrador: leerBorrador,
    borrarBorrador: borrarBorrador,
    valido: valido
  };
})();
